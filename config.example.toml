# Copy to ~/.config/videoflashback/config.toml (or $XDG_CONFIG_HOME/videoflashback/config.toml)

[output]
# Destination folder for saved clips. "~" is expanded to $HOME.
directory = "~/Videos/Captures"

# Filename pattern using strftime (see `man 3 strftime`).
# Default example: 2024-10-29 17-08-18.mp4
filename_format = "%Y-%m-%d %H-%M-%S.mp4"

# Optional shell command after a successful save.
# Placeholders: %f = full path, %d = directory, %n = filename.
# notify_command = "notify-send 'VideoFlashback' 'Saved %n'"

# Unix socket used by flashback-server / flashback-trigger.
socket_path = "/tmp/videoflashback.sock"

[replay]
# How many seconds of A/V to keep in the ring buffer.
buffer_seconds = 30

[video]
# Encode at most this many frames per second (extras from PipeWire are dropped).
capture_fps = 60

# Encode resolution. "native" uses the captured size.
# Otherwise WIDTHxHEIGHT, e.g. "1920x1080".
scale = "native"

# Software codec when hw_encoder is empty: "h264" or "hevc".
encoding = "h264"

# "bitrate" (use bitrate=) or "crf" (use crf=).
rate_control = "bitrate"
bitrate = 12000000
crf = 23

# Keyframe spacing in seconds (~1 keyframe per this many seconds).
keyframe_interval_sec = 1.0

# Encoder preset / tune (empty tune disables it).
preset = "veryfast"
tune = "zerolatency"

# Optional hardware encoder:
#   "auto"       = VAAPI (AMD/Intel) → NVENC (if CUDA) → AMF → software
#   "software"   = force CPU encode
#   "h264_vaapi", "h264_nvenc", ... = force a specific FFmpeg encoder
hw_encoder = "auto"

# Preferred PipeWire / scaler pixel format:
# bgra, rgba, bgr0, rgb0, argb, abgr
pixel_format = "bgra"

# Drop oldest pending frames when the encode queue exceeds this (0 = unlimited).
max_queue_frames = 120

# Embed the mouse cursor in the portal screen cast stream.
include_cursor = true

[audio]
sample_rate = 48000
channels = 2
bitrate = 128000

# "default"/"auto" = detect default sink via wpctl, or a PipeWire node id.
device = "default"
